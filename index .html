<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>職涯大探索｜生命科學</title>
<style>
:root{--bg:#f4eddd;--paper:#fffaf0;--olive:#3d4a2d;--olive2:#64734a;--brown:#765035;--gold:#d8aa50;--ink:#293127;--muted:#687060;--line:#d8cbb5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--olive);color:#fff;border-bottom:4px solid #29331f}.topin{max-width:1160px;height:64px;margin:auto;padding:0 16px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;white-space:nowrap}.logo{width:34px;height:34px;border:2px solid #d9b46a;border-radius:8px;display:grid;place-items:center;background:#566841}.brand small{display:block;font-size:9px;opacity:.7;letter-spacing:.12em}.topnav{margin-left:auto;display:flex;gap:4px;overflow:auto}.tab{background:transparent;color:#eef2e8;border:1px solid transparent;border-radius:8px;padding:8px 10px;white-space:nowrap}.tab.active,.tab:hover{background:#586841;border-color:#788963}.userpill{font-size:12px;background:#52613c;padding:7px 10px;border-radius:99px;white-space:nowrap}
.wrap{max-width:1160px;margin:auto;padding:26px 16px 60px}.screen{min-height:calc(100vh - 64px)}.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:28px;align-items:center;padding-top:28px}.hero h1{font-size:48px;line-height:1.15;margin:12px 0 18px}.lead{font-size:17px;line-height:1.8;color:#566052}.heroimg{border:4px solid #5a3d2a;border-radius:16px;overflow:hidden;background:#263025;box-shadow:0 12px 0 rgba(93,63,42,.12)}.heroimg img{display:block;width:100%;height:auto}.tag{display:inline-block;background:#293127;color:#f5df9f;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:800}
.btn{border:2px solid var(--brown);border-radius:9px;padding:10px 15px;font-weight:800}.primary{background:var(--brown);color:#fff}.soft{background:#eadcbf;color:#5b422e}.ghost{background:transparent;color:var(--brown)}.muted{color:var(--muted);font-size:13px;line-height:1.65}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}.feature,.card{background:var(--paper);border:2px solid var(--line);border-radius:14px;box-shadow:0 8px 22px rgba(75,59,37,.08)}.feature{padding:14px}.feature b{display:block;margin-bottom:5px}.feature span{font-size:12px;color:var(--muted)}
.onboard{max-width:760px;margin:34px auto}.onboard .card{padding:28px}.steps{display:flex;gap:8px;margin-bottom:24px}.step{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ddd5c6;color:#665f50;font-weight:900}.step.on{background:var(--brown);color:#fff}.field{margin:16px 0}label{display:block;font-weight:800;margin-bottom:7px}input,textarea{width:100%;padding:11px;border:2px solid #c9bda9;border-radius:9px;background:#fff;color:#293127;outline:none;-webkit-text-fill-color:#293127}input::placeholder,textarea::placeholder{color:#9b907d}input:focus,textarea:focus{border-color:var(--brown);box-shadow:0 0 0 3px rgba(118,80,53,.12)}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{padding:12px;text-align:left;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.choice.sel,.choice:hover{border-color:var(--brown);background:#f5e8d2}.choice b{display:block}.choice span{font-size:12px;color:var(--muted)}.actions{display:flex;justify-content:space-between;margin-top:20px}
.title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:8px 0 20px}.title h2{margin:4px 0;font-size:30px}.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:900;color:var(--brown)}.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.panel{padding:20px}.panel h3{margin:0 0 12px}.role{display:grid;grid-template-columns:1fr 210px;gap:15px}.placeholder{min-height:170px;border:2px dashed #bbae99;border-radius:12px;background:#eee6d6;display:grid;place-items:center;text-align:center;color:#776c5c}.salary{font-size:25px;font-weight:900;color:var(--brown)}.pill{display:inline-block;background:#eee4d2;border:1px solid #d5c6ad;border-radius:99px;padding:6px 9px;margin:3px;font-size:12px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.kpi{padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px}.kpi strong{display:block;font-size:20px;color:var(--brown);margin-top:3px}.list{display:grid;gap:7px}.row{display:flex;gap:9px;padding:9px;border-bottom:1px dashed #d9cdb9}.ico{width:28px;height:28px;background:#e7dcc8;border-radius:7px;display:grid;place-items:center;flex:none}.progress{height:9px;background:#ddd5c7;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--brown));border-radius:20px}
.calendar{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.month{padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff}.game{min-height:330px;background:linear-gradient(#9dc9df 0 38%,#c6d98e 38%);border:3px solid #53623b;border-radius:14px;position:relative;overflow:hidden;margin-bottom:15px}.game:after{content:"";position:absolute;inset:38% 0 0;background:radial-gradient(circle at 20% 40%,#7f9d58 0 9%,transparent 10%),radial-gradient(circle at 70% 60%,#8aa660 0 10%,transparent 11%),linear-gradient(160deg,#78954f,#b3c978)}.node{position:absolute;z-index:2;padding:9px 11px;border:3px solid #4e3928;background:#fff0c7;border-radius:9px;font-weight:900;box-shadow:0 4px 0 rgba(60,44,30,.22)}.start{left:6%;bottom:15%}.n2{left:31%;top:29%}.n3{left:54%;bottom:17%}.boss{right:6%;top:24%;background:#50362d;color:#ffe8a7}.quests{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quest{padding:14px;border:2px solid var(--line);border-radius:11px;background:#fff}.xp{color:#9b6d12;font-weight:900;font-size:12px}
.library{display:grid;grid-template-columns:200px 1fr;gap:14px}.folder{padding:9px;border-radius:8px}.folder:hover{background:#e8ddc7}.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.doc{padding:12px;border:2px solid var(--line);border-radius:11px;background:#fff}.thumb{height:82px;background:#e8decb;border-radius:8px;display:grid;place-items:center;font-size:30px;margin-bottom:9px}.chat{min-height:470px;display:flex;flex-direction:column}.msgs{flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto;padding-bottom:10px}.bubble{max-width:80%;padding:10px 12px;border-radius:11px;line-height:1.6}.ai{background:#eee4d2}.me{background:#5e7042;color:#fff;align-self:flex-end}.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.quick button{border:1px solid #cdbfa8;background:#fff8e9;border-radius:99px;padding:6px 9px;color:#5c4937}.chatbox{display:flex;gap:7px}.chatbox textarea{flex:1;min-height:48px}.modal{position:fixed;inset:0;background:rgba(30,34,25,.65);z-index:50;display:grid;place-items:center;padding:18px}.modalbox{max-width:680px;width:100%;background:var(--paper);border:3px solid var(--brown);border-radius:14px;padding:22px}
@media(max-width:850px){.hero,.grid2,.role,.library{grid-template-columns:1fr}.features{grid-template-columns:repeat(2,1fr)}.calendar{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:38px}.topnav{display:none}.docs{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.features,.choices,.quests,.docs,.kpis{grid-template-columns:1fr}.hero h1{font-size:31px}.title{align-items:flex-start;flex-direction:column}}
</style></head>

let s={page:"home",step:1,user:{name:"",school:"",year:"大二",interests:[],career:"research"},tasks:[],docs:[],hours:5,ai:[]};
const $=x=>document.querySelector(x);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const C=()=>careers.find(x=>x.id===s.user.career)||careers[0];
const save=()=>localStorage.setItem("careerRPG2",JSON.stringify(s));
function load(){try{const x=JSON.parse(localStorage.getItem("careerRPG2"));if(x)s=x}catch(e){}}
function seed(){s.tasks=C().tasks.map((x,i)=>({id:i+1,title:x,done:false,xp:i===C().tasks.length-1?80:20+i*10,boss:i===C().tasks.length-1}));}
const pct=()=>s.tasks.length?Math.round(s.tasks.filter(x=>x.done).length/s.tasks.length*100):0;
function go(p){s.page=p;save();render();scrollTo(0,0)}
function header(){if(s.page==="onboard")return"";return `<header class="top"><div class="topin"><div class="brand" onclick="go('home')"><div class="logo">C</div><div>職涯大探索<small>CAREER EXPLORER AI</small></div></div><div class="topnav">${[["home","首頁"],["career","職涯地圖"],["planner","時間規劃"],["game","冒險任務"],["library","知識庫"],["ai","AI 顧問"]].map(x=>`<button class="tab ${s.page===x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</div><div class="userpill">${esc(s.user.name||"探索者")} · ${s.user.year}</div></div></header>`}
function home(){return `<div class="wrap screen"><div class="hero"><div><span class="tag">生命科學學生專用 · Career RPG</span><h1>把大學四年，<br>玩成你的職涯冒險。</h1><p class="lead">選一個想去的方向，系統把能力、課程、時間與任務拆成一張可以一步步走的地圖。</p><button class="btn primary" onclick="go('onboard')">開始我的冒險 →</button></div><div class="heroimg"><img src="${HERO}" alt="像素風學生房間"></div></div><div class="features">${[["🧭","職涯地圖","看懂不同職涯需要什麼"],["📚","課程規劃","把能力拆成學習路線"],["⚔️","冒險任務","把學習變成打怪升級"],["🤖","AI 顧問","根據你的進度給下一步"]].map(x=>`<div class="feature"><b>${x[0]} ${x[1]}</b><span>${x[2]}</span></div>`).join("")}</div></div>`}
function onboard(){let b;if(s.step===1)b=`<h2>先建立你的角色</h2><p class="muted">這個平台直接服務生命科學相關學生，所以不用再選科系。</p><div class="field"><label>你的名字</label><input id="name" placeholder="例如：小安" value="${esc(s.user.name)}"></div><div class="field"><label>學校</label><input id="school" placeholder="例如：國立○○大學" value="${esc(s.user.school)}"></div>`;else if(s.step===2)b=`<h2>你現在在哪裡？</h2><p class="muted">年級與興趣會影響後面的任務排序。</p><label>目前年級</label><div class="choices">${["大一","大二","大三","大四"].map(y=>`<button class="choice ${s.user.year===y?"sel":""}" onclick="s.user.year='${y}';render()"><b>${y}</b></button>`).join("")}</div><div class="field"><label>你喜歡哪種冒險？</label><div class="choices">${["🧪 實驗研究","📊 數據分析","🩺 醫療應用","🌱 農業／食品","💬 溝通表達","💼 商業市場"].map(x=>`<button class="choice ${s.user.interests.includes(x)?"sel":""}" onclick="interest('${x}')"><b>${x}</b></button>`).join("")}</div></div>`;else if(s.step===3)b=`<h2>你想往哪裡走？</h2><p class="muted">先選一個主要方向，之後可以隨時切換。</p><div class="choices">${careers.map(c=>`<button class="choice ${s.user.career===c.id?"sel":""}" onclick="s.user.career='${c.id}';render()"><b>${c.icon} ${c.title}</b><span>${c.group}</span></button>`).join("")}</div>`;else{let c=C();b=`<div style="text-align:center"><span class="tag">READY</span><h2 style="margin-top:15px">你的職涯冒險即將開始</h2><p>${esc(s.user.name||"探索者")}，你選擇了「${c.title}」。</p><div class="card panel"><div class="salary">${c.salary}</div><p>${c.skills.slice(0,4).join(" · ")}</p></div></div>`}return `<div class="wrap screen"><div class="onboard"><div class="card"><div class="steps">${[1,2,3,4].map(i=>`<div class="step ${s.step>=i?"on":""}">${i}</div>`).join("")}</div>${b}<div class="actions"><button class="btn ghost" onclick="prev()">← 上一步</button><button class="btn primary" onclick="next()">下一步 →</button></div></div></div></div>`}
function next(){if(s.step===1){s.user.name=$("#name").value.trim();s.user.school=$("#school").value.trim();if(!s.user.name){alert("請先輸入名字");return}}if(s.step<4)s.step++;else{seed();s.page="home";s.onboard=false;save()}render()}
function prev(){if(s.step>1)s.step--;else s.page="home";render()}
function interest(x){s.user.interests.includes(x)?s.user.interests=s.user.interests.filter(a=>a!==x):s.user.interests.push(x);render()}
function careerPage(){let c=C();return `<div class="wrap"><div class="title"><div><div class="eyebrow">CAREER MAP</div><h2>${c.icon} ${c.title}</h2><div class="muted">${esc(s.user.name||"探索者")} 的職涯路線</div></div><button class="btn soft" onclick="picker()">切換職涯</button></div><div class="grid2"><div class="card panel"><div class="role"><div><div class="salary">${c.salary}</div><p class="muted">目前為 MVP 示意資料，正式版可接真實職缺資料。</p><h3>具備能力</h3>${c.skills.map((x,i)=>`<span class="pill">${i<3?"✓":"○"} ${x}</span>`).join("")}</div><div class="placeholder">🧬<br>職涯圖片預留區<br><small>之後可放職業插圖</small></div></div><div class="kpis"><div class="kpi">能力<strong>${c.skills.length}</strong></div><div class="kpi">課程<strong>${c.courses.length}</strong></div><div class="kpi">完成<strong>${pct()}%</strong></div></div></div><div class="card panel"><h3>🎯 下一關</h3><div class="salary">${s.tasks.find(x=>!x.done)?.title||"全部完成！"}</div><p class="muted">完成任務後，成果會進入你的知識庫。</p><button class="btn primary" onclick="go('game')">去打怪 →</button></div></div><div class="grid2" style="margin-top:16px"><div class="card panel"><h3>📚 課程規劃</h3><div class="list">${c.courses.map((x,i)=>`<div class="row"><div class="ico">${i+1}</div><div><b>${x}</b><div class="muted">${i<2?"核心基礎":"加深探索"}</div></div></div>`).join("")}</div></div><div class="card panel"><h3>🏆 證照／訓練</h3><span class="pill">專業訓練</span><span class="pill">依職涯方向</span><h3 style="margin-top:20px">能力進度</h3><div class="progress"><i style="width:${Math.max(8,pct())}%"></i></div></div></div></div>`}
function planner(){let c=C();return `<div class="wrap"><div class="title"><div><div class="eyebrow">CAREER PLANNER</div><h2>把目標放進你的時間裡</h2><div class="muted">依每週時間把長期目標拆成小步驟。</div></div><button class="btn primary" onclick="go('game')">開始任務</button></div><div class="card panel"><h3>每週可投入：${s.hours} 小時</h3><input style="width:100%" type="range" min="1" max="15" value="${s.hours}" oninput="s.hours=this.value;save();render()"><div class="calendar" style="margin-top:15px">${["現在","第2月","第3月","第4月","第5月","第6月"].map((m,i)=>`<div class="month"><b>${m}</b><p class="muted">${c.tasks[i%c.tasks.length]}</p><div class="progress"><i style="width:${20+i*15}%"></i></div></div>`).join("")}</div></div><div class="grid2" style="margin-top:16px"><div class="card panel"><h3>🎓 大學四年</h3><div class="list">${["大一｜打底：基礎課程＋探索","大二｜升級：專題／實驗／跨域","大三｜實戰：實習＋作品","大四｜Boss：成果＋求職／研究所"].map((x,i)=>`<div class="row"><div class="ico">${["🌱","🛠️","🚀","👑"][i]}</div><div><b>${x}</b><div class="muted">完成後解鎖下一階段</div></div></div>`).join("")}</div></div><div class="card panel"><h3>⏱️ 時間原則</h3><p class="muted">不是把行程塞滿，而是讓每一個月都有一個可以完成的成果。</p></div></div></div>`}
function game(){let c=C();return `<div class="wrap"><div class="title"><div><div class="eyebrow">QUEST MODE</div><h2>⚔️ 把學習變成打怪</h2><div class="muted">小怪＝平常累積；Boss＝階段成果。</div></div><span class="tag">完成度 ${pct()}%</span></div><div class="card panel"><div class="game"><div class="node start">🌱 START<br><small>${esc(s.user.name||"探索者")}</small></div><div class="node n2">👾 課程小怪</div><div class="node n3">🧪 實驗小怪</div><div class="node boss">👑 BOSS<br>${c.title}</div></div><div class="quests">${s.tasks.map(t=>`<div class="quest"><span class="xp">${t.boss?"BOSS":"小怪"} · +${t.xp} XP</span><h3>${esc(t.title)}</h3><p class="muted">${t.done?"已擊破，戰利品已加入知識庫。":"完成後解鎖下一個能力節點。"}</p><button class="btn ${t.done?"soft":"primary"}" onclick="toggle(${t.id})">${t.done?"已擊破 ✓":"打倒它！"}</button></div>`).join("")}</div></div></div>`}
function toggle(id){let t=s.tasks.find(x=>x.id===id);if(t){t.done=!t.done;if(t.done)s.docs.unshift({title:t.title,type:t.boss?"Boss 成果":"任務紀錄",emoji:t.boss?"👑":"⚔️"});save();render()}}
function library(){return `<div class="wrap"><div class="title"><div><div class="eyebrow">KNOWLEDGE BASE</div><h2>🧠 我的職涯資產</h2><div class="muted">把課程、實驗、專題與實習留下來。</div></div><button class="btn primary" onclick="addDoc()">＋ 新增資料</button></div><div class="library"><div class="card panel"><b>分類</b>${["全部","課程","實驗","專題","實習","證照"].map(x=>`<div class="folder">📁 ${x}</div>`).join("")}</div><div class="docs">${s.docs.length?s.docs.map(d=>`<div class="doc"><div class="thumb">${d.emoji||"📘"}</div><b>${esc(d.title)}</b><div class="muted">${esc(d.type)}</div></div>`).join(""):`<div class="card" style="grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)">還沒有戰利品，先去冒險任務完成第一隻小怪吧！</div>`}</div></div></div>`}
function addDoc(){let x=prompt("這筆資料叫什麼？");if(x){s.docs.unshift({title:x,type:"我的學習紀錄",emoji:"📘"});save();render()}}
function ai(){let c=C();return `<div class="wrap"><div class="title"><div><div class="eyebrow">AI CAREER COACH</div><h2>🤖 AI 職涯顧問</h2><div class="muted">根據你的目標、任務與累積，陪你決定下一步。</div></div></div><div class="grid2"><div class="card panel"><div class="chat"><div class="msgs">${s.ai.length?s.ai.map(m=>`<div class="bubble ${m.me?"me":"ai"}">${esc(m.text)}</div>`).join(""):`<div class="bubble ai">嗨 ${esc(s.user.name||"探索者")}！你目前正在探索「${c.title}」。可以問我下一步、能力差距、課程或時間安排。</div>`}</div><div class="quick"><button onclick="ask('我現在最該先做什麼？')">我現在最該先做什麼？</button><button onclick="ask('我的能力差距？')">我的能力差距？</button><button onclick="ask('幫我安排下個月')">幫我安排下個月</button></div><div class="chatbox"><textarea id="q" placeholder="輸入問題，例如：我大三了，現在該怎麼準備？"></textarea><button class="btn primary" onclick="send()">送出</button></div></div></div><div class="card panel"><h3>目前狀態</h3><div class="salary">${pct()}%</div><div class="progress"><i style="width:${pct()}%"></i></div><div class="list" style="margin-top:15px"><div class="row"><div class="ico">🎯</div><div><b>目標</b><div class="muted">${c.title}</div></div></div><div class="row"><div class="ico">⚔️</div><div><b>任務</b><div class="muted">${s.tasks.filter(x=>x.done).length}/${s.tasks.length} 已完成</div></div></div><div class="row"><div class="ico">🧠</div><div><b>知識庫</b><div class="muted">${s.docs.length} 筆累積</div></div></div></div></div></div></div>`}
function reply(q){let c=C(),n=s.tasks.find(x=>!x.done);if(/差距|缺什麼/.test(q))return `以「${c.title}」來看，可以優先補 ${c.skills.slice(3).join("、")}。先完成「${n?.title||"下一個 Boss"}」。`;if(/下個月|安排/.test(q))return `下個月先抓兩件事：① ${n?.title||"完成目前任務"} ② ${c.courses[0]}。你每週可投入 ${s.hours} 小時，先穩定完成。`;return `依你目前的進度，我建議下一步先打掉「${n?.title||"目前 Boss"}」。完成後把成果放進知識庫，再調整下一階段。`}
function ask(q){s.ai.push({me:true,text:q},{me:false,text:reply(q)});save();render()}function send(){let x=$("#q");if(x&&x.value.trim())ask(x.value.trim())}
function picker(){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modalbox"><div class="title"><h3>選擇探索路線</h3><button class="btn ghost" onclick="document.getElementById('modal').remove()">關閉</button></div><div class="choices">${careers.map(c=>`<button class="choice" onclick="s.user.career='${c.id}';seed();save();document.getElementById('modal').remove();render()"><b>${c.icon} ${c.title}</b><span>${c.group}</span></button>`).join("")}</div></div></div>`)}
function render(){let body=s.page==="home"?home():s.page==="onboard"?onboard():s.page==="career"?careerPage():s.page==="planner"?planner():s.page==="game"?game():s.page==="library"?library():ai();document.getElementById("app").innerHTML=s.onboard&&s.page!=="onboard"?body:header()+body}
load();if(!s.tasks.length)seed();render();
</script></body></html>
